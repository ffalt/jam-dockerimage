name: Docker Jam Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "jam/**"

permissions:
  contents: read

jobs:
  build:
    name: JamImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to DockerHub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Get latest versions
        id: versions
        run: bash scripts/get-versions.sh
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./jam/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ffalt/jam:latest
          build-args: |
            JAMSERVE_VERSION=${{ steps.versions.outputs.jamserve_version }}
            JAMBERRY_VERSION=${{ steps.versions.outputs.jamberry_version }}
